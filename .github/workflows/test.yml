name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  config-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify lib modules
        run: |
          for f in \
            00-bootstrap.sh 01-constants.sh 02-output.sh 03-installer.sh 03-system.sh 20-paths.sh 40-network.sh \
            41-safety.sh 21-config-base.sh 22-state.sh 31-service.sh 30-xray-core.sh \
            50-vless-common.sh 54-ss2022.sh 50-vless-enc.sh \
            51-reality.sh 52-xhttp.sh 53-advanced.sh 55-socks.sh 56-tunnel.sh \
            70-view.sh 71-cli-view.sh 80-menu.sh \
            63-diag.sh 60-doctor.sh 61-smoke.sh 62-export.sh \
            73-cli-migrate.sh 72-cli-core.sh 72-cli-admin.sh 74-cli-protocols.sh \
            90-test-harness.sh 81-help.sh
          do
            test -f "lib/$f"
          done
          lines=$(wc -l < install.sh)
          echo "install.sh lines: $lines"
          test "$lines" -lt 900

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Bash syntax check
        run: bash -n install.sh

      - name: ShellCheck modular libraries
        run: shellcheck -x -S error lib/*.sh

      - name: Smoke test CLI entry
        run: bash install.sh version

      - name: Run offline config generation tests
        run: bash tests/test_config_generation.sh
