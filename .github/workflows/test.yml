name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  config-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run offline config generation tests
        run: bash tests/test_config_generation.sh
