name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --pull -f Dockerfile.test -t xray-oneclick-test .

      - name: Run complete test suite
        run: docker run --rm xray-oneclick-test
